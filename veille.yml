name: Veille des préfectures

on:
  schedule:
    # Heures UTC (Paris = UTC+1 en hiver, UTC+2 en été). Rythme calé sur les créneaux de publication des arrêtés.
    - cron: "*/30 5-23 * * *"      # journée : toutes les 30 minutes
    - cron: "0 0-4 * * *"          # nuit : toutes les heures
    - cron: "*/15 14-21 * * 5"     # vendredi 15h-23h Paris : veille renforcée, toutes les 15 minutes
    - cron: "*/15 5-12 * * 6"      # samedi 6h-14h Paris : veille renforcée
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium
      - name: Collecte et mise à jour du site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://front-administratif.fr' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/public_html' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIF_CLE: ${{ secrets.NOTIF_CLE }}
          AUTO_REGISTRE: ${{ vars.AUTO_REGISTRE || '1' }}
        run: python3 collecteur.py
